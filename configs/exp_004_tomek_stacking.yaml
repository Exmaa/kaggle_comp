experiment_id: "EXP_004"
description: "Feature Engineering v3 (42 Fitur) + Tomek Links Boundary Cleaning + Multi-Model Stacking (NNLS)"
created_at: "2026-11-07 21:30:00"
objective: "Maximize OOF ROC-AUC and Nested Balanced Accuracy to prepare high-precision submissions for Kaggle reset"

dataset:
  train_parquet: "feature_engineering_script/output/train_fe_v3.parquet"
  test_parquet: "feature_engineering_script/output/test_fe_v3.parquet"
  total_features: 42
  raw_features: 11
  engineered_features: 31
  cv_scheme: "Stratified 5-Fold with fixed fold assignment (data/cv_folds.parquet)"

models:
  - name: "XGB_FE3"
    type: "xgboost"
    params:
      learning_rate: 0.03
      max_depth: 6
      subsample: 0.80
      colsample_bytree: 0.70
      min_child_weight: 8
      gamma: 0.5
      reg_lambda: 2.0
      reg_alpha: 0.5
  - name: "XGB_Tomek"
    type: "xgboost_boundary_cleaned"
    cleaning: "Tomek Links (1-NN mutual opposite-class neighbor removal on majority Y=0 in-fold)"
    params:
      learning_rate: 0.03
      max_depth: 6
      subsample: 0.80
      colsample_bytree: 0.70
      min_child_weight: 8
  - name: "RF_FE3"
    type: "ranger_random_forest"
    params:
      num_trees: 300
      mtry: 7
      min_node_size: 15
      splitrule: "gini"
  - name: "ET_FE3"
    type: "ranger_extratrees"
    params:
      num_trees: 300
      mtry: 8
      min_node_size: 15
      splitrule: "extratrees"
      num_random_splits: 5
  - name: "GLMNET_FE3"
    type: "elasticnet"
    params:
      alpha: 0.5
      scaling: "in-fold log1p + standard scale"

meta_learner:
  type: "Non-Negative Least Squares (NNLS / Constrained Ridge Regression)"
  constraint: "coefficients >= 0, normalized sum = 1.0"

evaluation:
  metric: "Balanced Accuracy & ROC-AUC"
  nested_cv: true
  teacher_sim: true
