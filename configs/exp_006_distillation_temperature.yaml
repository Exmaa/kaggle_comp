experiment_id: "EXP_006"
description: "Knowledge Distillation via In-Fold Teacher Ensemble with Temperature Scaling"
created_at: "2026-11-07 22:25:00"
objective: "Train Student GBDT on soft probability targets generated by Meta-Teacher Zoo to eliminate human label noise"

dataset:
  train_parquet: "feature_engineering_script/output/train_fe_v4.parquet"
  test_parquet: "feature_engineering_script/output/test_fe_v4.parquet"
  total_features: 46
  cv_scheme: "Stratified 5-Fold with fixed fold assignment (data/cv_folds.parquet)"

distillation_architecture:
  teacher_zoo:
    - "XGBoost Regularized (500 rounds)"
    - "Ranger Random Forest (300 trees)"
    - "GLMnet ElasticNet (alpha=0.5)"
  teacher_weights:
    xgb: 0.45
    rf: 0.35
    glm: 0.20
  temperature: 1.5
  student_loss: "reg:logistic on soft probability targets"
  student_model: "XGBoost Deep Distillation (600 rounds, depth=6, lr=0.03)"

evaluation:
  metric: "Balanced Accuracy & ROC-AUC"
  nested_cv: true
  teacher_agreement_benchmark: true
