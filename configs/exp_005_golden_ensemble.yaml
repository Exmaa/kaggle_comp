experiment_id: "EXP_005"
description: "The Golden Shot Master Ensemble: FE v4 (46 Fitur + monetary_polarity + dual-regime) + Tomek Boundary Cleaning + NNLS Stacking"
created_at: "2026-11-07 22:00:00"
objective: "Maximize OOF ROC-AUC and produce 1 Single Definitive Submission to seize Rank 1 at Kaggle Reset"

dataset:
  train_parquet: "feature_engineering_script/output/train_fe_v4.parquet"
  test_parquet: "feature_engineering_script/output/test_fe_v4.parquet"
  total_features: 46
  raw_features: 11
  engineered_features: 35
  key_innovations:
    - "monetary_polarity (Spearman rho = 0.3306, #1 strongest feature)"
    - "seg_atm_profile (36.37% positive rate ATM/M-Banking segment)"
    - "seg_kiosk_profile (4.61% positive rate eceran segment)"
    - "digital_expenditure_share (non-overflowing digital dominance)"
  cv_scheme: "Stratified 5-Fold with fixed fold assignment (data/cv_folds.parquet)"

models:
  - name: "XGB_FE4"
    type: "xgboost"
    params:
      learning_rate: 0.03
      max_depth: 6
      subsample: 0.80
      colsample_bytree: 0.70
      min_child_weight: 8
      gamma: 0.5
      reg_lambda: 2.0
      reg_alpha: 0.5
  - name: "XGB_Tomek4"
    type: "xgboost_boundary_cleaned"
    cleaning: "Tomek Links (1-NN mutual opposite-class neighbor removal on majority Y=0 in-fold)"
  - name: "RF_FE4"
    type: "ranger_random_forest"
    params:
      num_trees: 300
      mtry: 7
      min_node_size: 15
      splitrule: "gini"
  - name: "ET_FE4"
    type: "ranger_extratrees"
    params:
      num_trees: 300
      mtry: 8
      min_node_size: 15
      splitrule: "extratrees"
      num_random_splits: 5
  - name: "GLMNET_FE4"
    type: "elasticnet"
    params:
      alpha: 0.5
      scaling: "in-fold log1p + standard scale"

meta_learner:
  type: "Non-Negative Least Squares (NNLS / Constrained Ridge Regression)"
  constraint: "coefficients >= 0, normalized sum = 1.0"

submission_strategy:
  target_positive_percentage: 13.34
  target_positive_count: 667
  rationale: "Empirical Parabola Vertex from Kaggle Gate 0 probe series, maximizing True Positives in top decile"
  active_file: "data/submission.parquet"
