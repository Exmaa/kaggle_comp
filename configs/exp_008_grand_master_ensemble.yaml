experiment_id: "EXP_008"
description: "The Grand Master Minimax Ensemble: Hierarchical Stacking of Tomek, Polarity, Distillation, and Transductive Models"
created_at: "2026-11-07 22:35:00"
objective: "Achieve the absolute pinnacle of local cross-validation performance and robustness by unifying all 4 modelling paradigms"

constituent_models:
  - id: "EXP_004"
    family: "Tomek_Boundary_Cleaned_XGBoost"
    inductive_bias: "Clean decision margins by eliminating 1,800 borderline noise points"
  - id: "EXP_005"
    family: "NonLinear_Polarity_Master_Ensemble"
    inductive_bias: "Monetary polarity (rho=0.3306) and dual-regime banking vs kiosk profiles"
  - id: "EXP_006"
    family: "Knowledge_Distillation_Student"
    inductive_bias: "Continuous soft target probability manifold (T=1.5) eliminating human stochasticity"
  - id: "EXP_007"
    family: "Transductive_SemiSupervised_GBDT"
    inductive_bias: "Low-density separation aligned with unlabelled test distribution"

meta_learner:
  type: "Hierarchical Constrained NNLS (Non-Negative Least Squares with Ridge Penalty)"
  constraints: "weights >= 0, sum(weights) = 1.0"

evaluation:
  metric: "Balanced Accuracy & ROC-AUC"
  nested_cv: true
  bootstrap_significance_test: true
